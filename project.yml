name: Wize
options:
  bundleIdPrefix: com.lyuai
  deploymentTarget:
    iOS: '27.0'
targets:
  Wize:
    type: application
    platform: iOS
    sources:
      - path: Wize
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyuai.wize
        INFOPLIST_FILE: Wize/Info.plist
        WIZE_RELEASE_DATE: '2026-11-07'
        MARKETING_VERSION: '0.2.1'
        CURRENT_PROJECT_VERSION: '3'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
