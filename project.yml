name: Wize
options:
  bundleIdPrefix: com.lyuai
  deploymentTarget:
    iOS: '27.0'
targets:
  Wize:
    type: application
    platform: iOS
    sources: [Wize]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyuai.wize
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 无知
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
